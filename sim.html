<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gomoku Poker - Self-Play Simulator</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
      .sim-shell { max-width: 960px; margin: 0 auto; padding: 20px; }
      .sim-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
      .sim-controls label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
      .sim-controls input { background: #111218; color: var(--ink); }
      .sim-output { white-space: pre-wrap; font-family: "Courier New", monospace; padding: 16px; min-height: 400px; }
      .sim-bar { height: 12px; background: #222; border: 2px solid var(--shadow); margin: 12px 0; }
      .sim-bar > div { height: 100%; background: var(--green); width: 0; transition: width 0.1s linear; }
      #runButton { background: var(--green); }
    </style>
  </head>
  <body>
    <main class="sim-shell">
      <h1>Self-Play Simulator</h1>
      <p class="muted">ランダムBOTの自己対戦で先手有利度を測定します。</p>
      <div class="sim-controls">
        <label>試合数 <input id="games" type="number" value="2000" min="10" max="100000"></label>
        <label>宣言確率 (0〜1) <input id="declareProb" type="number" value="0.7" min="0" max="1" step="0.05"></label>
        <label>seed (空=ランダム) <input id="seed" type="number" placeholder="empty"></label>
        <label>&nbsp;<button id="runButton" type="button">実行</button></label>
      </div>
      <div class="sim-bar"><div id="bar"></div></div>
      <div class="pixel-card sim-output" id="out">ここに結果が出ます。</div>
    </main>
    <script type="module" src="./bot/sim-browser.js"></script>
  </body>
</html>
