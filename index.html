<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gomoku Poker</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="ゲーム情報">
        <div class="title-block">
          <p class="eyebrow">Gomoku Poker</p>
          <h1>五目ポーカー</h1>
        </div>
        <div class="rules-block" aria-label="ルール">
          <h2>ルール</h2>
          <p>1ターンに自分のカードを1枚置き、宣言するか相手にターンを渡します。</p>
          <p>5マスラインに自分のカードが4枚以上、相手が1枚までなら宣言できます。</p>
          <p>宣言された側は1枚置いてから必ず応戦宣言します。役を比べて勝敗を決めます。</p>
        </div>
        <div class="mode-panel" aria-label="モード選択">
          <div class="mode-row">
            <select id="modeSelect">
              <option value="local">vs 対人</option>
              <option value="cpu" selected>vs CPU</option>
              <option value="room">ルーム</option>
              <option value="test">テストモード</option>
            </select>
            <button id="startButton" type="button" class="start-button">開始</button>
          </div>
          <div id="connectionStatus" class="conn-status">オフライン</div>
          <div id="roomPanel" class="sub-panel" hidden>
            <div class="room-actions">
              <button id="createRoomButton" type="button">部屋を作る</button>
            </div>
            <div class="join-row">
              <input id="roomCodeInput" autocomplete="off" spellcheck="false" placeholder="例: AB12CD">
              <button id="joinRoomButton" type="button">参加</button>
            </div>
            <label id="roomTestModeWrap" hidden style="display: block; margin-top: 10px; font-size: 12px; color: var(--gold);">
              <input type="checkbox" id="roomTestMode"> テストモード部屋として作成 (起動者同士のみ)
            </label>
            <p id="roomInfo" class="muted">部屋を作るか、コードを入れて参加。</p>
          </div>
          <div id="testPanel" class="sub-panel" hidden>
            <p class="muted" style="margin-bottom: 6px;">テストモード</p>
            <label class="field-label" for="testWeightsFile">CPU 重みファイル (差し替え)</label>
            <input id="testWeightsFile" type="file" accept=".json,application/json">
            <p id="testWeightsStatus" class="muted">埋め込みデフォルトを使用中</p>
            <div class="test-rules">
              <p class="muted">実験ルール</p>
              <label><input type="checkbox" id="ruleNoCenterFirst"> 黒の初手は中央3×3を禁止</label>
              <label><input type="checkbox" id="ruleStrictClaim"> 宣言条件: 自分5枚かつ相手0枚のみ</label>
              <label><input type="checkbox" id="ruleResponseDouble" checked> 応戦時に赤が2枚連続配置 (テストモード自動)</label>
            </div>
          </div>
          <div class="mode-buttons">
            <button id="resetButton" type="button">盤面リセット</button>
            <button id="acceptResetButton" type="button" hidden>リセットに同意</button>
          </div>
        </div>
      </section>

      <section class="play-area">
        <aside class="side-panel">
          <div class="pixel-card score-card">
            <h2>カード</h2>
            <div class="turn-actions">
              <button id="declareButton" class="declare-button" type="button">宣言</button>
              <button id="passButton" class="pass-button" type="button">相手にターンを渡す</button>
            </div>
            <div id="hand" class="hand" aria-label="カード一覧"></div>
          </div>
        </aside>

        <section class="board-wrap" aria-label="盤面">
          <div id="board" class="board"></div>
        </section>

        <aside class="side-panel">
          <div class="pixel-card">
            <h2>宣言状況</h2>
            <div class="turn-indicator">
              <strong id="turnLabel">黒の番</strong>
              <span id="turnTimer" class="turn-timer" aria-live="polite"></span>
            </div>
            <div id="bestHand" class="best-hand">まだ宣言できる役はありません。</div>
          </div>
          <div class="pixel-card">
            <h2>ログ</h2>
            <ol id="log" class="log"></ol>
          </div>
        </aside>
      </section>
    </main>

    <div id="passwordModal" class="modal" hidden>
      <div class="modal-card">
        <button class="modal-close" id="passwordModalClose" type="button">×</button>
        <h2>テストモード起動</h2>
        <p class="muted" style="margin: 10px 0;">キーを入力してください</p>
        <input id="passwordInput" type="password" placeholder="key" autocomplete="off" style="margin-bottom: 8px;">
        <button id="passwordSubmit" type="button" style="background: var(--green);">起動</button>
        <p id="passwordError" class="muted" hidden style="color: var(--red); margin-top: 8px;">キーが違います</p>
      </div>
    </div>

    <script src="./firebase-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
