<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gomoku Poker - 進化学習</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
      .tr-shell { max-width: 1100px; margin: 0 auto; padding: 16px; }
      .tr-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 12px; }
      .tr-controls label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
      .tr-controls input { background: #111218; color: var(--ink); }
      .tr-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
      .tr-row button { padding: 8px 14px; }
      #trStart { background: var(--green); }
      #trStop { background: var(--red); color: #fff; }
      #trDownload { background: #8eb6f0; }
      #trStatus { white-space: pre-wrap; font-family: "Courier New", monospace; padding: 10px; min-height: 80px; }
      #trBestJson { white-space: pre-wrap; font-family: "Courier New", monospace; font-size: 11px; padding: 10px; max-height: 250px; overflow: auto; }
      #trHistory { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; padding: 10px; }
      .tr-gen { background: var(--panel-2); padding: 6px 8px; font-size: 11px; border: 2px solid var(--shadow); }
      .tr-gen strong { display: block; color: var(--gold); }
      .tr-mini-board { display: grid; grid-template-columns: repeat(11, 1fr); gap: 0; margin-top: 4px; aspect-ratio: 1; border: 1px solid var(--shadow); }
      .tr-mini-cell { font-size: 6px; line-height: 1; display: grid; place-items: center; background: #c9a55c; color: #111; font-weight: 700; min-width: 0; min-height: 0; outline: 0.5px solid rgba(60,40,20,0.3); }
      .tr-mini-cell.black { background: #0d0d12; color: #f8f3df; }
      .tr-mini-cell.red { background: #de4a4a; color: #fff; }
      .tr-winner { display: block; color: var(--green); font-size: 10px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <main class="tr-shell">
      <h1>進化学習 (CPU育成)</h1>
      <p class="muted">ランダム重みのエージェント群を自己対戦トーナメントで世代交代させ、強い評価関数を発見します。</p>
      <div class="tr-controls">
        <label>個体数 <input id="trPop" type="number" value="8" min="2" max="32"></label>
        <label>世代数 <input id="trGen" type="number" value="20" min="1" max="500"></label>
        <label>各ペアの試合数 <input id="trMatches" type="number" value="2" min="1" max="10"></label>
        <label>最大配置手数 <input id="trMaxMoves" type="number" value="30" min="6" max="100" title="ロールアウト深さ制限"></label>
        <label>近傍距離 <input id="trDist" type="number" value="2" min="1" max="5" title="石からの距離マンハッタン"></label>
        <label>変異強度 σ (開始) <input id="trSigma" type="number" value="0.25" min="0.01" max="2" step="0.05"></label>
        <label>σ 終了値 (空=固定) <input id="trSigmaEnd" type="number" placeholder="例 0.05" min="0.001" max="2" step="0.01" title="最終世代でこの値まで線形減少 (アニーリング)"></label>
        <label>エリート保存数 <input id="trElite" type="number" value="2" min="0" max="8"></label>
        <label><input id="trFromRandom" type="checkbox" checked> ランダム初期化 (offで現在値開始)</label>
      </div>
      <div class="tr-row" style="align-items: center;">
        <label style="display: inline-grid; gap: 4px; font-size: 12px; color: var(--muted);">
          シード重み (任意): 既存JSONから継続学習
          <input id="trSeedFile" type="file" accept=".json,application/json" style="font-size: 11px;">
        </label>
        <span id="trSeedStatus" class="muted" style="font-size: 12px;">未指定</span>
        <button id="trSeedClear" type="button" style="background: #888; padding: 4px 10px;">クリア</button>
      </div>
      <div class="tr-row">
        <button id="trStart" type="button">開始</button>
        <button id="trStop" type="button" disabled>停止</button>
        <button id="trDownload" type="button" disabled>最良重みをDL</button>
      </div>
      <div class="pixel-card" id="trStatus">準備完了</div>
      <h2 style="margin-top: 16px; font-size: 16px;">最良エージェント (現世代)</h2>
      <div class="pixel-card" id="trBestJson">—</div>
      <h2 style="margin-top: 16px; font-size: 16px;">世代別 最良勝率</h2>
      <div class="pixel-card" id="trHistory"></div>

      <h2 style="margin-top: 24px;">ベンチマーク (vs 別重みセット)</h2>
      <p class="muted" style="font-size: 12px;">A 側と B 側の重みを直接対戦させ、A の勝率を測ります。B 未指定なら DEFAULT_WEIGHTS を使用。色番を半々で入れ替えるので先手有利の影響を除けます。</p>
      <div class="tr-row" style="align-items: center; gap: 10px;">
        <label style="display: inline-grid; gap: 4px; font-size: 12px; color: var(--muted);">A (挑戦者)
          <input id="bmFileA" type="file" accept=".json,application/json" style="font-size: 11px;">
        </label>
        <label style="display: inline-grid; gap: 4px; font-size: 12px; color: var(--muted);">B (相手、空でDEFAULT)
          <input id="bmFileB" type="file" accept=".json,application/json" style="font-size: 11px;">
        </label>
        <label style="display: inline-grid; gap: 4px; font-size: 12px; color: var(--muted);">試合数
          <input id="bmGames" type="number" value="50" min="2" max="2000" style="width: 80px;">
        </label>
        <label style="display: inline-grid; gap: 4px; font-size: 12px; color: var(--muted);">最大手数
          <input id="bmMaxMoves" type="number" value="40" min="6" max="100" style="width: 80px;">
        </label>
        <button id="bmRun" type="button" style="background: var(--green);">実行</button>
        <button id="bmStop" type="button" disabled style="background: var(--red); color: #fff;">停止</button>
        <button id="bmUseCurrentBest" type="button" style="background: #8eb6f0;">A=現在の最良</button>
        <label style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted);">
          <input id="bmKeepHistory" type="checkbox"> 試合履歴を保存
        </label>
      </div>
      <div id="bmStatus" class="muted" style="font-size: 12px; min-height: 16px;"></div>
      <div class="pixel-card" id="bmResult" style="font-family: 'Courier New', monospace; white-space: pre-wrap; min-height: 80px;">未実行</div>
      <div id="bmHistory" style="margin-top: 8px;"></div>
    </main>
    <script type="module">
      import { train, benchmark } from "./bot/training.js";
      const $ = (id) => document.getElementById(id);
      let bestWeights = null;
      let stopFlag = false;
      let seedWeights = null;

      function fmtPct(x) { return (x * 100).toFixed(1) + "%"; }

      function renderBest(w, generation, win) {
        bestWeights = w;
        $("trBestJson").textContent = `// 第${generation}世代 / 勝率 ${fmtPct(win)}\n` + JSON.stringify(w, null, 2);
        $("trDownload").disabled = false;
      }

      function appendHistory(gen, win, demoBoard) {
        const el = document.createElement("div");
        el.className = "tr-gen";
        const head = document.createElement("strong");
        head.textContent = `G${gen} - ${fmtPct(win)}`;
        el.appendChild(head);
        if (demoBoard && demoBoard.board) {
          const grid = document.createElement("div");
          grid.className = "tr-mini-board";
          for (const cell of demoBoard.board) {
            const c = document.createElement("div");
            c.className = "tr-mini-cell";
            if (cell) {
              c.classList.add(cell.owner);
              c.textContent = cell.rank;
            }
            grid.appendChild(c);
          }
          el.appendChild(grid);
          const w = demoBoard.winner;
          const lbl = document.createElement("span");
          lbl.className = "tr-winner";
          if (!w) lbl.textContent = "—";
          else if (w.color === "draw") lbl.textContent = "引分";
          else lbl.textContent = (w.color === "black" ? "黒" : "赤") + "勝";
          el.appendChild(lbl);
        }
        $("trHistory").appendChild(el);
      }

      async function start() {
        $("trStart").disabled = true;
        $("trStop").disabled = false;
        $("trDownload").disabled = true;
        stopFlag = false;
        bestWeights = null;
        $("trHistory").innerHTML = "";
        $("trBestJson").textContent = "実行中…";

        const opts = {
          popSize: Number($("trPop").value),
          generations: Number($("trGen").value),
          matchesPerPair: Number($("trMatches").value),
          maxMoves: Number($("trMaxMoves").value),
          distMax: Number($("trDist").value),
          sigma: Number($("trSigma").value),
          eliteKeep: Number($("trElite").value),
          fromRandom: $("trFromRandom").checked,
          seedWeights,
          sigmaEnd: $("trSigmaEnd").value === "" ? null : Number($("trSigmaEnd").value),
        };

        const t0 = performance.now();
        const hooks = {
          shouldStop: () => stopFlag,
          onProgress: async (info) => {
            $("trStatus").textContent = `第${info.gen + 1}/${opts.generations}世代 - 個体 ${info.agentIdx + 1}/${info.popSize} 評価中…`;
            await new Promise((r) => setTimeout(r, 0));
          },
          onGeneration: async (info) => {
            const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
            const sigmaInfo = info.sigmaGen != null ? ` / σ=${info.sigmaGen.toFixed(3)}` : "";
            $("trStatus").textContent = `第${info.gen + 1}/${opts.generations}世代 完了 (${elapsed}s経過${sigmaInfo})\n最良勝率 ${fmtPct(info.bestWin)}`;
            renderBest(info.best, info.gen + 1, info.bestWin);
            appendHistory(info.gen + 1, info.bestWin, info.demoBoard);
            await new Promise((r) => setTimeout(r, 0));
          },
        };
        try {
          await train(opts, hooks);
          const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
          $("trStatus").textContent += `\n終了 (${elapsed}s)`;
        } catch (e) {
          $("trStatus").textContent = "エラー: " + e.message;
          console.error(e);
        }
        $("trStart").disabled = false;
        $("trStop").disabled = true;
      }

      function stop() {
        stopFlag = true;
        $("trStop").disabled = true;
      }

      $("trStart").addEventListener("click", start);
      $("trStop").addEventListener("click", stop);

      $("trSeedFile").addEventListener("change", async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          if (typeof parsed !== "object" || !parsed) throw new Error("不正なJSON");
          seedWeights = parsed;
          $("trSeedStatus").textContent = `読み込み済: ${file.name} (${Object.keys(parsed).length}キー)`;
          $("trSeedStatus").style.color = "var(--green)";
        } catch (err) {
          $("trSeedStatus").textContent = "エラー: " + err.message;
          $("trSeedStatus").style.color = "var(--red)";
          seedWeights = null;
        }
      });

      $("trSeedClear").addEventListener("click", () => {
        seedWeights = null;
        $("trSeedFile").value = "";
        $("trSeedStatus").textContent = "未指定";
        $("trSeedStatus").style.color = "";
      });

      // ---- Benchmark ----
      let bmWeightsA = null;
      let bmWeightsB = null;
      let bmStopFlag = false;
      async function readJsonFile(file) {
        const text = await file.text();
        return JSON.parse(text);
      }
      $("bmFileA").addEventListener("change", async (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        try { bmWeightsA = await readJsonFile(f); $("bmStatus").textContent = `A 読込: ${f.name}`; }
        catch (err) { $("bmStatus").textContent = "A エラー: " + err.message; bmWeightsA = null; }
      });
      $("bmFileB").addEventListener("change", async (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        try { bmWeightsB = await readJsonFile(f); $("bmStatus").textContent = `B 読込: ${f.name}`; }
        catch (err) { $("bmStatus").textContent = "B エラー: " + err.message; bmWeightsB = null; }
      });
      const BOARD_SIZE = 11;
      function moveToText(m) {
        if (m.kind === "place") {
          const row = Math.floor(m.index / BOARD_SIZE) + 1;
          const col = (m.index % BOARD_SIZE) + 1;
          const c = m.color === "black" ? "黒" : "赤";
          return `${c}${m.rank}@(${row},${col})`;
        }
        if (m.kind === "declare") {
          const c = m.color === "black" ? "黒" : "赤";
          return `${c}宣言(${m.hand || "?"})`;
        }
        if (m.kind === "pass") {
          const c = m.color === "black" ? "黒" : "赤";
          return `${c}pass`;
        }
        return "?";
      }
      function renderHistories(histories) {
        const wrap = $("bmHistory");
        wrap.innerHTML = "";
        if (!histories || !histories.length) return;
        const title = document.createElement("h3");
        title.textContent = `試合履歴 (${histories.length}局)`;
        title.style.fontSize = "13px";
        title.style.margin = "8px 0";
        wrap.appendChild(title);
        for (const g of histories) {
          const det = document.createElement("details");
          det.style.background = "var(--panel-2)";
          det.style.border = "2px solid var(--shadow)";
          det.style.marginBottom = "4px";
          det.style.padding = "4px 8px";
          const sum = document.createElement("summary");
          sum.style.cursor = "pointer";
          sum.style.fontSize = "12px";
          const colorLabel = g.aIsBlack ? "A=黒/B=赤" : "B=黒/A=赤";
          const w = g.winner?.color || "?";
          const winnerColor = w === "draw" ? "引分" : (w === "black" ? "黒勝" : "赤勝");
          const reason = g.winner?.reason || "";
          sum.textContent = `G${g.gameIndex + 1} [${colorLabel}] ${winnerColor} (${g.winnerLabel}) - ${g.moves.length}手 ${reason ? "/ " + reason : ""}`;
          det.appendChild(sum);
          const body = document.createElement("div");
          body.style.fontSize = "11px";
          body.style.fontFamily = "Courier New, monospace";
          body.style.padding = "4px";
          body.style.lineHeight = "1.5";
          body.textContent = g.moves.map((m, i) => `${i + 1}. ${moveToText(m)}`).join("  →  ");
          det.appendChild(body);
          wrap.appendChild(det);
        }
      }

      $("bmUseCurrentBest").addEventListener("click", () => {
        if (!bestWeights) { $("bmStatus").textContent = "現在の最良重みが無い (まず学習してください)"; return; }
        bmWeightsA = { ...bestWeights };
        $("bmStatus").textContent = "A = 現在の最良 (学習結果)";
      });
      $("bmStop").addEventListener("click", () => { bmStopFlag = true; $("bmStop").disabled = true; });

      $("bmRun").addEventListener("click", async () => {
        if (!bmWeightsA) { $("bmStatus").textContent = "A を指定してください"; return; }
        $("bmRun").disabled = true;
        $("bmStop").disabled = false;
        bmStopFlag = false;
        $("bmResult").textContent = "実行中…";
        const keepHistory = $("bmKeepHistory").checked;
        const opts = {
          weightsA: bmWeightsA,
          weightsB: bmWeightsB || undefined,
          games: Number($("bmGames").value),
          maxMoves: Number($("bmMaxMoves").value),
          distMax: Number($("trDist").value),
          keepHistory,
        };
        const t0 = performance.now();
        try {
          const res = await benchmark(opts, {
            shouldStop: () => bmStopFlag,
            onProgress: async (p) => {
              $("bmStatus").textContent = `${p.progress}/${p.total} 完了 / A勝 ${p.aWins} B勝 ${p.bWins} 引分 ${p.draws}`;
              await new Promise(r => setTimeout(r, 0));
            },
          });
          const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
          const fmt = (x) => (x * 100).toFixed(1) + "%";
          $("bmResult").textContent = [
            `総試合数: ${res.total}  (${elapsed}s)`,
            `A 勝率: ${fmt(res.aWinRate)}  (${res.aWins}勝)`,
            `B 勝率: ${fmt(res.bWinRate)}  (${res.bWins}勝)`,
            `引分: ${fmt(res.drawRate)}  (${res.draws})`,
            "",
            `A が黒で: ${res.aAsBlack.win}勝 / ${res.aAsBlack.lose}負 / ${res.aAsBlack.draw}分`,
            `A が赤で: ${res.aAsRed.win}勝 / ${res.aAsRed.lose}負 / ${res.aAsRed.draw}分`,
            "",
            res.aWinRate > 0.55 ? "→ A は B より明らかに強い" :
            res.aWinRate > 0.50 ? "→ A はわずかに強い (誤差レベルかも)" :
            res.aWinRate > 0.45 ? "→ ほぼ互角" :
            "→ A は B より弱い",
          ].join("\n");
          $("bmStatus").textContent = `完了`;
          renderHistories(res.histories);
        } catch (e) {
          $("bmResult").textContent = "エラー: " + e.message;
          console.error(e);
        }
        $("bmRun").disabled = false;
        $("bmStop").disabled = true;
      });
      $("trDownload").addEventListener("click", () => {
        if (!bestWeights) return;
        const blob = new Blob([JSON.stringify(bestWeights, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `weights-${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });
    </script>
  </body>
</html>
